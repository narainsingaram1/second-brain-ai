<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src ipc: http://ipc.localhost" />
    <title>Allow this step?</title>
    <style>
      :root { color-scheme: light dark; --bg: #fbfaf8; --ink: #1d1b18; --muted: #6b665e; --line: #e4e0d8; --raised: #ffffff; --danger: #c6362f; --accent: #1d1b18; }
      @media (prefers-color-scheme: dark) { :root { --bg: #17161a; --ink: #f1efe9; --muted: #a29d94; --line: #2d2b30; --raised: #1f1e23; --danger: #ef6b62; --accent: #f1efe9; } }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Geist", system-ui, sans-serif; }
      body { display: flex; flex-direction: column; padding: 18px 20px 16px; gap: 12px; -webkit-user-select: none; user-select: none; }
      .site { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
      .site b { color: var(--ink); font-weight: 600; }
      h1 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
      .shot { flex: 1; min-height: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--raised); overflow: hidden; display: flex; }
      .shot img { width: 100%; height: 100%; object-fit: contain; object-position: top; }
      .shot.empty { flex: 0 0 auto; padding: 14px; color: var(--muted); font-size: 12px; }
      ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
      li + li { margin-top: 2px; }
      .why { color: var(--ink); }
      footer { display: flex; gap: 8px; align-items: center; }
      footer .spacer { flex: 1; }
      button { font: inherit; font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      button.quiet { border-color: transparent; background: transparent; color: var(--muted); font-weight: 500; padding: 8px 6px; }
      button.allow { background: var(--danger); border-color: var(--danger); color: #fff; }
      button:disabled { opacity: .45; cursor: default; }
      .hint { font-size: 11px; color: var(--muted); }
      .error { color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="site">Synapse wants to act on <b id="site">a website</b></div>
    <h1 id="label">Loading…</h1>
    <div class="shot empty" id="shot">No screenshot. Turn on Precise mode in the Synapse extension to see the page here.</div>
    <ul id="details"></ul>
    <footer>
      <button type="button" class="quiet" id="never">Never on this site</button>
      <span class="spacer"></span>
      <span class="hint" id="hint"></span>
      <button type="button" id="deny" autofocus>Don’t allow</button>
      <button type="button" class="allow" id="allow" disabled>Allow once</button>
    </footer>
    <script type="module" src="/src/approval/approval.ts"></script>
  </body>
</html>
