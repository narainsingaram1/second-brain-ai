<!doctype html><html><head><meta charset="utf-8"><title>Software Engineering Intern - Careers</title></head><body><main>
<h1>Software Engineering Intern</h1>
<div role="tablist"><button role="tab" id="tab-overview" aria-selected="true">Overview</button> <button role="tab" id="tab-app" aria-selected="false">Application</button></div>
<section id="overview"><p>Join us for the summer. Apply below.</p></section>
<!-- Like a Greenhouse embed: the form lives on another site, in a frame that loads only when its tab opens. -->
<section id="app" hidden><iframe id="grnhse" title="Greenhouse Job Board" style="width:100%;height:420px;border:0"></iframe></section>
</main><script>
document.getElementById('tab-app').onclick = () => {
  document.getElementById('overview').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('tab-app').setAttribute('aria-selected', 'true');
  document.getElementById('tab-overview').setAttribute('aria-selected', 'false');
  const other = location.hostname === 'localhost' ? '127.0.0.1' : 'localhost';
  document.getElementById('grnhse').src = `${location.protocol}//${other}:${location.port}/fixtures/job-form.html?slow=1`;
};
</script></body></html>
